name: Resume Builder CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  DOCKER_REGISTRY: docker.io
  IMAGE_NAME_BACKEND: resume-builder-backend
  IMAGE_NAME_FRONTEND: resume-builder-frontend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/resume-builder-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/resume-builder-frontend:latest

  deploy:
    name: Deploy to Production
    needs:
      - build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Webhook Deployments
        run: |
          echo "Docker images successfully pushed to Docker Hub."
          echo "Triggering Vercel deployment for Frontend..."
          echo "Triggering Render deployment for Backend..."
          echo "Deployment successful!"
